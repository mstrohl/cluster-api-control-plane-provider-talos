---
kind: auto.CI
spec:
  compileGHWorkflowsOnly: true
---
kind: common.Repository
spec:
  licenseChecks:
    - skipPaths:
        - .git/
        - testdata/
      includeSuffixes:
        - .go
      excludeSuffixes:
        - .pb.go
        - _string.go
        - _enumer.go
        - _string_linux.go
        - zz_generated.deepcopy.go
      header: |
        // This Source Code Form is subject to the terms of the Mozilla Public
        // License, v. 2.0. If a copy of the MPL was not distributed with this
        // file, You can obtain one at http://mozilla.org/MPL/2.0/.
---
kind: common.GHWorkflow
spec:
  jobs:
    - name: default
      buildxOptions:
        enabled: true
      runnerGroup: generic
      conditions:
        - on-pull-request
      steps:
        - name: all
          environment:
            PLATFORM: linux/amd64,linux/arm64
            REGISTRY: registry.dev.siderolabs.io
            PUSH: true
        - name: check-dirty
        - name: unit-tests
        - name: integration-test-build
        - name: upload-integration-test-binary
          artifactStep:
            type: upload
            artifactName: integration-test-binary
            artifactPath: _out/
    - name: integration-test-openstack
      runnerGroup: generic # placeholder, patched to the ARC scale-set name by `make rekres`
      depends:
        - default
      conditions:
        - on-pull-request
      steps:
        - name: download-integration-test-binary
          artifactStep:
            type: download
            artifactName: integration-test-binary
            artifactPath: _out/
        - name: integration-test-run
          environment:
            REGISTRY: registry.dev.siderolabs.io
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            CI: false
            OPENSTACK_CLOUD_YAML_B64: ${{ secrets.OPENSTACK_CLOUD_YAML_B64 }}
            OPENSTACK_CACERT_B64: ${{ secrets.OPENSTACK_CACERT_B64 }}
            OPENSTACK_IMAGE_NAME: ${{ secrets.OPENSTACK_IMAGE_NAME }}
            OPENSTACK_EXTERNAL_NETWORK_ID: ${{ secrets.OPENSTACK_EXTERNAL_NETWORK_ID }}
            OPENSTACK_FAILURE_DOMAIN: ${{ secrets.OPENSTACK_FAILURE_DOMAIN }}
            OPENSTACK_DNS_NAMESERVERS: ${{ secrets.OPENSTACK_DNS_NAMESERVERS }}
            OPENSTACK_NODE_CIDR: ${{ secrets.OPENSTACK_NODE_CIDR }}
            OPENSTACK_CONTROL_PLANE_MACHINE_FLAVOR: ${{ secrets.OPENSTACK_CONTROL_PLANE_MACHINE_FLAVOR }}
            OPENSTACK_NODE_MACHINE_FLAVOR: ${{ secrets.OPENSTACK_NODE_MACHINE_FLAVOR }}
    - name: push
      buildxOptions:
        enabled: true
      runnerGroup: generic
      conditions:
        - except-pull-request
        - not-on-tag
      steps:
        - name: login-to-registry
          registryLoginStep:
            registry: ghcr.io
        - name: push
          command: all
          environment:
            PLATFORM: linux/amd64,linux/arm64
            PUSH: true
    - name: tag
      buildxOptions:
        enabled: true
      runnerGroup: generic
      conditions:
        - only-on-tag
      steps:
        - name: release
        - name: login-to-registry
          registryLoginStep:
            registry: ghcr.io
        - name: push
          command: all
          environment:
            PLATFORM: linux/amd64,linux/arm64
            PUSH: true
        - name: release
          releaseStep:
            baseDirectory: _out
            artifacts:
              - control-plane-talos/*/*
            generateChecksums: true
            releaseNotes: RELEASE_NOTES.md
